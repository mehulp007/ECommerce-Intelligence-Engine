[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-intelligence-engine"
version = "0.1.0"
description = "Leakage-aware customer intelligence pipelines for the UCI Online Retail dataset"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
data = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "openpyxl>=3.1,<4",
    "pyarrow>=17,<25",
]
train = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "openpyxl>=3.1,<4",
    "pyarrow>=17,<25",
    "scikit-learn>=1.5,<2",
    "xgboost>=2.1,<4",
    "shap>=0.46,<1",
    "joblib>=1.4,<2",
    "matplotlib>=3.9,<4",
    "mlflow>=2.18,<4",
]
recommend = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "pyarrow>=17,<25",
    "scipy>=1.12,<2",
    "threadpoolctl>=3.2,<4",
    "implicit>=0.7,<1",
]
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "pyarrow>=17,<25",
    "scikit-learn>=1.5,<2",
    "xgboost>=2.1,<4",
    "joblib>=1.4,<2",
    "scipy>=1.12,<2",
    "threadpoolctl>=3.2,<4",
    "implicit>=0.7,<1",
]
ui = [
    "streamlit>=1.42,<2",
    "httpx>=0.28,<1",
    "plotly>=6,<7",
]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
    "black>=25,<27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"api/main.py" = ["B008"]  # FastAPI dependency injection uses Depends defaults.

[tool.black]
line-length = 88
target-version = ["py312"]
