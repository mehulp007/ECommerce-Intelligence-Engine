[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-intelligence-engine"
version = "2.0.0.dev0"
description = "Retail intelligence studio on the H&M Personalized Fashion dataset"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "typer>=0.12,<1",
]

[project.optional-dependencies]
data = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "pyarrow>=17,<25",
    "duckdb>=1.1,<2",
    "pillow>=11,<13",
    "kaggle>=1.8,<3",
]
train = [
    "scikit-learn>=1.5,<2",
    "xgboost>=2.1,<4",
    "optuna>=4,<5",
    "joblib>=1.4,<2",
]
recsys = [
    "lightgbm>=4.5,<5",
    "implicit>=0.7,<1",
    "scipy>=1.12,<2",
    "threadpoolctl>=3.2,<4",
    "faiss-cpu>=1.8,<2",
]
search = [
    "torch>=2.4",
    "transformers>=4.45,<6",
    "faiss-cpu>=1.8,<2",
]
api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.4,<3",
]
copilot = [
    "google-genai>=2.30,<3",
]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "ruff>=0.9,<1",
    "black>=25,<27",
]

[project.scripts]
eie = "ecommerce_intelligence.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/ecommerce_intelligence/cli.py" = ["B008"]  # Typer options use call defaults.

[tool.black]
line-length = 88
target-version = ["py312"]
