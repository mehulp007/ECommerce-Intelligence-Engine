services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      args:
        BUNDLE_VERSION: ${BUNDLE_VERSION:?Set BUNDLE_VERSION to the promoted bundle directory name}
    environment:
      EIE_API_KEY: ${EIE_API_KEY:?Set EIE_API_KEY to a local secret}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
